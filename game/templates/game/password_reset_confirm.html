{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Checkora</title>
    <link rel="stylesheet" href="{% static 'game/css/auth.css' %}?v=8">
    <link rel="icon" type="image/jpeg" href="{% static 'game/favicon.jpeg' %}">
</head>
<body>
    <!-- Back-to-home arrow -->
    <a href="{% url 'landing' %}" class="back-home" aria-label="Back to home">&larr; Home</a>

    <!-- Django messages passed to JS as JSON (toasts) -->
    <script id="django-messages-data" type="application/json">
        [{% for message in messages %}
            {"level_tag": "{{ message.tags }}", "message": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}
        {% endfor %}]
    </script>

    <!-- Toast container -->
    <div id="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

    <div class="header">
        <div class="logo-container">
            <img src="{% static 'game/checkora_icon_only.png' %}" class="logo-icon-img" alt="Checkora">
            <span class="logo-text">Checkora</span>
        </div>
        <p>Set your new password</p>
    </div>

    <div class="auth-card">
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="field-errors">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-gold">Set New Password</button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'login' %}">Back to Sign In</a>
        </div>
    </div>

    <script src="{% static 'game/js/auth.js' %}?v=8"></script>
</body>
</html>
