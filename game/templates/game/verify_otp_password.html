{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Checkora</title>
    <link rel="stylesheet" href="{% static 'game/css/auth.css' %}?v=8">
    <link rel="icon" type="image/jpeg" href="{% static 'game/favicon.jpeg' %}">
    <style>
        .otp-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .otp-input {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #f0c040;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .otp-input:focus {
            outline: none;
            border-color: #f0c040;
            box-shadow: 0 0 0 2px rgba(240, 192, 64, 0.2);
        }
    </style>
</head>
<body>

    <!-- Django messages → JS toasts -->
    <script id="django-messages-data" type="application/json">
        [{% for message in messages %}
            {"level_tag": "{{ message.tags }}", "message": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}
        {% endfor %}]
    </script>

    <!-- Toast container -->
    <div id="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

    <div class="header">
        <h1>Verify OTP</h1>
        <p>Enter the 6-digit code sent to your email for password reset.</p>
    </div>

    <div class="auth-card">
        <form method="POST" id="otp-form" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="otp">Enter 6-Digit OTP</label>
                <div class="otp-container">
                    <input type="text" id="otp" name="otp"
                           class="otp-input" maxlength="6"
                           pattern="\d{6}" placeholder="000000"
                           autocomplete="one-time-code"
                           inputmode="numeric"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-gold" id="otp-submit-btn">Verify OTP</button>
        </form>

        <div class="auth-footer">
            Didn't receive the code? <a href="{% url 'forgot_password' %}">Try again</a>
        </div>
    </div>

    <script src="{% static 'game/js/auth.js' %}?v=8"></script>
</body>
</html>
